name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip proyek
        run: |
          mkdir -p /tmp/proj
          unzip -q "$(find . -maxdepth 2 -name '*.zip' | head -1)" -d /tmp/proj
          D=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          echo "Proyek ada di: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Nara-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
