name: Build Banyak APK (armeabi-v7a)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  list-zips:
    runs-on: ubuntu-latest
    outputs:
      zips: ${{ steps.find.outputs.zips }}
    steps:
      - uses: actions/checkout@v4

      - name: Cari semua zip
        id: find
        run: |
          set -e
          LIST=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "Ditemukan: $LIST"
          if [ "$LIST" = "[]" ]; then echo "Tidak ada file zip di repo"; exit 1; fi
          echo "zips=$LIST" >> "$GITHUB_OUTPUT"

  build:
    needs: list-zips
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        zip: ${{ fromJson(needs.list-zips.outputs.zips) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          set -e
          ZIP="${{ matrix.zip }}"
          mkdir -p _src
          echo "Using zip: $ZIP"
          unzip -q -o "$ZIP" -d _src
          NAME=$(basename "$ZIP" .zip | tr ' ' '_')
          ROOT=$(find _src -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts -o -name gradlew \) \
                 -not -path "*/__MACOSX/*" -printf '%d %h\n' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ROOT" ]; then echo "Project Gradle tidak ditemukan di $ZIP"; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          echo "App name: $NAME"

      - name: Setup Gradle (jika tidak ada wrapper)
        if: ${{ hashFiles('_src/**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Force armeabi-v7a only
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/abi.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def android = p.extensions.findByName('android')
              if (android != null && p.plugins.hasPlugin('com.android.application')) {
                android.defaultConfig.ndk.abiFilters.clear()
                android.defaultConfig.ndk.abiFilters.add('armeabi-v7a')
                try { android.splits.abi.enable = false } catch (ignored) {}
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Rename APK
        run: |
          set -e
          APK=$(find "$PROJECT_ROOT" -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; exit 1; fi
          mkdir -p _out
          cp "$APK" "_out/${APP_NAME}.apk"
          ls -lh _out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APP_NAME }}
          path: _out/${{ env.APP_NAME }}.apk
          if-no-files-found: error

  collect:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download semua APK
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: all
          merge-multiple: true

      - name: Upload gabungan
        uses: actions/upload-artifact@v4
        with:
          name: semua-apk
          path: all/*.apk
          if-no-files-found: ignore
